<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamonds — Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #16213e;
      --navy-light: #243556;
      --accent: #6b8de4;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #e2e5eb;
      --text: #1a2035;
      --text-muted: #6b7280;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
    }

    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Header ── */
    header {
      background: var(--navy); color: white; padding: 0 24px; height: 56px;
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }

    .logo { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; letter-spacing: 0.04em; }

    .logo-diamond {
      width: 20px; height: 20px; background: var(--accent);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }

    .demo-pill {
      font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      background: rgba(107,141,228,0.2); color: var(--accent);
      border: 1px solid rgba(107,141,228,0.4); padding: 3px 10px; border-radius: 20px;
    }

    .header-right { display: flex; align-items: center; gap: 12px; }

    .btn-ghost {
      background: none; border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.65); padding: 5px 12px;
      border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); color: white; }

    /* ── Progress ── */
    .progress-bar { height: 2px; background: var(--border); flex-shrink: 0; }
    .progress-fill { height: 100%; background: var(--accent); transition: width 0.4s ease; }

    /* ── Chat ── */
    #chat {
      flex: 1; overflow-y: auto; padding: 32px 24px 24px;
      display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;
    }

    .message-wrap { display: flex; flex-direction: column; max-width: 680px; }
    .message-wrap.user { align-self: flex-end; align-items: flex-end; }
    .message-wrap.assistant { align-self: flex-start; }

    .message { padding: 14px 18px; border-radius: 14px; font-size: 15px; line-height: 1.65; }

    .message.assistant {
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: 0 1px 4px rgba(0,0,0,0.05); border-bottom-left-radius: 4px;
    }

    .message.user { background: var(--navy); color: white; border-bottom-right-radius: 4px; }

    .message.assistant strong { font-weight: 600; }
    .message.assistant em { font-style: italic; }
    .message.assistant p { margin-bottom: 10px; }
    .message.assistant p:last-child { margin-bottom: 0; }
    .message.assistant ul { padding-left: 20px; margin-bottom: 10px; }
    .message.assistant li { margin-bottom: 4px; }

    /* ── Typing dots ── */
    .typing {
      display: flex; align-items: center; gap: 5px;
      padding: 14px 18px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px; border-bottom-left-radius: 4px;
      width: fit-content;
    }
    .typing span {
      width: 7px; height: 7px; background: var(--accent);
      border-radius: 50%; animation: bounce 1.1s infinite; opacity: 0.5;
    }
    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Draft reply bubble (chat only — no actions inside) ── */
    .draft-wrap {
      align-self: flex-end;
      max-width: 680px;
    }

    .draft-bubble {
      padding: 14px 18px; border-radius: 14px; border-bottom-right-radius: 4px;
      font-size: 15px; line-height: 1.65;
      background: rgba(22, 33, 62, 0.07);
      border: 1.5px dashed rgba(22, 33, 62, 0.22);
      color: var(--navy); white-space: pre-wrap;
      min-width: 120px;
    }

    /* ── Footer — always visible, holds Send ── */
    footer {
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 12px 24px; flex-shrink: 0;
    }

    .footer-send-row {
      display: none;
      align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .footer-send-row.visible { display: flex; }

    .cycle-btn {
      background: none; border: none; padding: 0;
      font-size: 13px; color: var(--accent);
      cursor: pointer; font-family: inherit;
    }
    .cycle-btn:hover { text-decoration: underline; }

    .send-btn {
      padding: 9px 22px; background: var(--navy); color: white;
      border: none; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 500; font-family: inherit;
      transition: background 0.15s;
    }
    .send-btn:hover:not(:disabled) { background: var(--navy-light); }
    .send-btn:disabled { background: var(--border); cursor: not-allowed; }

    .footer-note { font-size: 12px; color: var(--text-muted); text-align: center; }
    .footer-note a { color: var(--accent); text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }

    #chat::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  </style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-diamond"></div>Diamonds</div>
  <div class="header-right">
    <span class="demo-pill">Demo</span>
    <button class="btn-ghost" onclick="restartDemo()">↺ Restart</button>
  </div>
</header>

<div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>

<div id="chat"></div>

<footer>
  <div class="footer-send-row" id="footer-send-row">
    <button class="cycle-btn" id="footer-cycle" onclick="cycleReply()" style="visibility:hidden">↕ Try a different reply</button>
    <button class="send-btn" id="footer-send" onclick="sendDraft()" disabled>Send →</button>
  </div>
  <p class="footer-note">
    Scripted demo — a real session adapts to you ·
    <a href="/">Run a live session →</a>
  </p>
</footer>

<script>

// ── Script ─────────────────────────────────────────────────────────────────

const STEPS = {

  'open': {
    agent: `I'm Diamonds — I help you make sure you're solving a real problem before you build the answer to it.\n\nWhat are you hoping something like this actually does for you?`,
    replies: [
      { text: `I want to make sure we're not building the wrong thing.`, next: 'what-working-on' },
      { text: `I need to figure out what to work on next.`, next: 'what-working-on' },
    ]
  },

  'what-working-on': {
    agent: `That's the right instinct — and the most common way teams end up there is by skipping steps they know they should take.\n\nWhat are you working on right now?`,
    replies: [
      { text: `A meal planning app for busy families. We've been at it about three months and just kicked off our MVP.`, next: 'ask-validation' },
    ]
  },

  'ask-validation': {
    agent: `Three months in, MVP underway — that's real investment already.\n\nWhat's your evidence that busy families need a better meal planning solution — not a sense that it's a pain point, but something you've validated with real people?`,
    replies: [
      { text: `We talked to a few friends with kids and they all said meal planning is a hassle. We also looked at the App Store — lots of apps but none of them seem great.`, next: 'name-gap' },
    ]
  },

  'name-gap': {
    agent: `That's a starting point, not validation. Your friends confirming it's a hassle tells you the problem is real for them — but not what they actually need, how they're solving it today, or whether an app is what they'd reach for. The App Store tells you there's a market, not that there's an unmet need your solution addresses.\n\nHave you sat with real families and let them show you the problem — rather than confirm what you already believe?`,
    replies: [
      { text: `Honestly, no. We assumed we knew enough to start building.`, next: 'offer-support' },
    ]
  },

  'offer-support': {
    agent: `That's honest — and it's where most teams are.\n\nBefore another line of code, I'd spend time with five to eight real families — not asking what they want, but watching how they actually navigate meals across a week. What shifts direction isn't confirming the problem exists; it's seeing how people are already solving it.\n\nI can help you design that research, or run a simulation to sharpen your questions first. Which is more useful?`,
    replies: [
      { text: `I'd rather design the real research. What does that involve?`, next: 'research-focus' },
      { text: `A simulation sounds useful — what would that look like?`, next: 'sim-setup' },
    ]
  },

  // ── Real research path ─────────────────────────────────────────────────

  'research-focus': {
    agent: `Good. Before you talk to anyone, nail three things: who you're talking to, what you're trying to learn, and how you'll create conditions for people to tell you something you don't already know.\n\nYou've got the who. What's the single most important thing you don't yet know about how these families manage meals?`,
    replies: [
      { text: `Whether the problem is in deciding what to cook, or in the actual shopping and prep.`, next: 'protocol' },
    ]
  },

  'protocol': {
    agent: `That's exactly the right question — and the fact you don't know the answer yet is why you're doing this research.\n\nHere's a starter protocol for a 45-minute conversation. These are a spine, not a script — your follow-up questions matter more than getting through the list.\n\n**Opening — 5 min**\n\nTell me about your week. What does a typical week look like for your family?\n\n**Their current reality — 15 min**\n\n- Walk me through how you handled meals this past week — not ideally, but how it actually went.\n- What had to happen before you could decide what to cook?\n- Where did things feel easy? Where did they break down?\n\n**Workarounds — 10 min**\n\n- What do you do when dinner just doesn't come together?\n- Is there anything you use to help — an app, a list, a group chat? Show me.\n\n**Stakes — 10 min**\n\n- What's the cost when it goes wrong?\n- What would it take for this to feel genuinely easy?\n\n**Closing — 5 min**\n\nWhat would you want someone building a tool for this to understand that most people get wrong?`,
    replies: [
      { text: `How do I make sure I'm actually listening, and not just confirming what I already think?`, next: 'listening-advice' },
    ]
  },

  'listening-advice': {
    agent: `A few rules for the session: ask about the past, not the future. Never "would you use this?" — always "walk me through when this last happened." When they offer a solution idea, ask what problem it's solving. When something surprises you, stay curious — don't explain it away.\n\nThe interview isn't done when you've covered every question. It's done when they've shown you something you didn't expect.`,
    replies: null
  },

  // ── Simulation path ────────────────────────────────────────────────────

  'sim-setup': {
    agent: `I'll play someone who fits your target — a parent in that household — and you run me through your questions as if it's a real interview. Treat it as a rehearsal: it surfaces the assumptions baked into your questions. The surprises that shift direction only come from real people.\n\nTo set it up: what does the family look like, and what do you most want to understand about how they manage meals?`,
    replies: [
      { text: `Two working parents, kids between 5 and 12. We want to understand where meal planning breaks down for them.`, next: 'sim-caution' },
    ]
  },

  'sim-caution': {
    agent: `Good framing. One thing before we start: "where it breaks down" is still solution-shaped — it assumes the problem is in the planning. You might find that planning isn't the issue at all; execution is, or shopping, or the negotiation about what everyone will eat. Go in with that openness.\n\nReady when you are — ask your first question.`,
    replies: null
  },

};

const MAX_VISITS = 7;

// ── Engine ─────────────────────────────────────────────────────────────────

let pendingReplies = [];
let selectedIndex  = 0;
let visitCount     = 0;
let agentTyping    = false;
let replyTyping    = false;

const chat          = document.getElementById('chat');
const progressEl    = document.getElementById('progress');
const footerSendRow = document.getElementById('footer-send-row');
const footerSend    = document.getElementById('footer-send');
const footerCycle   = document.getElementById('footer-cycle');

function updateProgress() {
  progressEl.style.width = Math.round((visitCount / MAX_VISITS) * 100) + '%';
}

function scroll() { chat.scrollTop = chat.scrollHeight; }

function addUserMessage(text) {
  const wrap = document.createElement('div');
  wrap.className = 'message-wrap user';
  const msg = document.createElement('div');
  msg.className = 'message user';
  msg.textContent = text;
  wrap.appendChild(msg);
  chat.appendChild(wrap);
  scroll();
}

function showTypingDots() {
  const wrap = document.createElement('div');
  wrap.className = 'message-wrap assistant';
  wrap.id = 'typing-wrap';
  wrap.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  chat.appendChild(wrap);
  scroll();
}

function removeTypingDots() { document.getElementById('typing-wrap')?.remove(); }

function renderMarkdown(raw) {
  let h = raw
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  h = h.replace(/\*\*\*(.+?)\*\*\*/gs, '<strong><em>$1</em></strong>');
  h = h.replace(/\*\*(.+?)\*\*/gs, '<strong>$1</strong>');
  h = h.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
  return h.split(/\n{2,}/).map(p => {
    p = p.trim();
    if (!p) return '';
    if (/^[-•] /m.test(p)) {
      const items = p.split('\n').filter(l => l.trim())
        .map(l => `<li>${l.replace(/^[-•]\s+/, '')}</li>`).join('');
      return `<ul>${items}</ul>`;
    }
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).filter(Boolean).join('\n');
}

function typeAgentMessage(text, onDone) {
  agentTyping = true;
  const wrap = document.createElement('div');
  wrap.className = 'message-wrap assistant';
  const bubble = document.createElement('div');
  bubble.className = 'message assistant';
  bubble.style.whiteSpace = 'pre-wrap';
  wrap.appendChild(bubble);
  chat.appendChild(wrap);

  const speed = text.length > 800 ? 5 : text.length > 500 ? 8 : text.length > 300 ? 13 : 18;
  let i = 0;
  function tick() {
    if (i < text.length) {
      bubble.textContent = text.slice(0, i + 1);
      scroll();
      i++;
      setTimeout(tick, speed);
    } else {
      bubble.style.whiteSpace = '';
      bubble.innerHTML = renderMarkdown(text);
      scroll();
      agentTyping = false;
      if (onDone) setTimeout(onDone, 300);
    }
  }
  setTimeout(tick, 0);
}

// Draft bubble (chat) — actions live in the footer
let draftWrap   = null;
let draftBubble = null;

function clearDraft() {
  draftWrap?.remove();
  draftWrap = draftBubble = null;
  footerSendRow.classList.remove('visible');
  footerSend.disabled = true;
  footerCycle.style.visibility = 'hidden';
}

function typeDraftText(text) {
  if (!draftBubble) return;
  replyTyping = true;
  footerSendRow.classList.remove('visible');
  footerSend.disabled = true;

  const target = draftBubble; // pin reference — guards against clearDraft mid-loop
  target.textContent = '';
  let i = 0;

  function revealSend() {
    replyTyping = false;
    footerSend.disabled = false;
    footerSendRow.classList.add('visible');
  }

  const timer = setInterval(() => {
    if (target !== draftBubble) { clearInterval(timer); return; } // draft was cleared
    if (i < text.length) {
      target.textContent = text.slice(0, ++i);
      scroll();
    } else {
      clearInterval(timer);
      revealSend();
    }
  }, 28);

  // Fallback: guarantee button appears even if interval misfires
  setTimeout(() => {
    if (replyTyping && target === draftBubble) {
      target.textContent = text;
      scroll();
      revealSend();
    }
  }, text.length * 28 + 1500);
}

function cycleReply() {
  if (replyTyping || agentTyping || pendingReplies.length < 2) return;
  selectedIndex = (selectedIndex + 1) % pendingReplies.length;
  typeDraftText(pendingReplies[selectedIndex].text);
}

function sendDraft() {
  if (!pendingReplies.length || footerSend.disabled) return;
  const chosen = pendingReplies[selectedIndex];
  clearDraft();
  pendingReplies = [];

  addUserMessage(chosen.text);
  visitCount++;
  updateProgress();
  setTimeout(() => showStep(chosen.next), 600);
}

function showReplies(replies) {
  clearDraft();

  if (!replies || replies.length === 0) {
    const end = document.createElement('p');
    end.style.cssText = 'text-align:right;font-size:13px;color:var(--text-muted);align-self:flex-end;';
    end.innerHTML = `End of this path · <a href="/" style="color:var(--accent);text-decoration:none;">Run a live session →</a>`;
    chat.appendChild(end);
    scroll();
    return;
  }

  pendingReplies = replies;
  selectedIndex  = 0;

  // Draft bubble in chat
  draftWrap = document.createElement('div');
  draftWrap.className = 'draft-wrap';
  draftBubble = document.createElement('div');
  draftBubble.className = 'draft-bubble';
  draftWrap.appendChild(draftBubble);
  chat.appendChild(draftWrap);
  scroll();

  // Prepare footer send row (revealed by typeDraftText when typing finishes)
  footerCycle.style.visibility = replies.length > 1 ? 'visible' : 'hidden';
  footerSend.disabled = true;

  typeDraftText(replies[0].text);
}

function showStep(stepId) {
  const entry = STEPS[stepId];
  if (!entry) return;
  showTypingDots();
  const thinkTime = entry.agent.length > 500 ? 1400 : 900;
  setTimeout(() => {
    removeTypingDots();
    typeAgentMessage(entry.agent, () => showReplies(entry.replies));
  }, thinkTime);
}

function restartDemo() {
  clearDraft();
  pendingReplies = [];
  selectedIndex  = 0;
  visitCount     = 0;
  chat.innerHTML = '';
  updateProgress();
  setTimeout(() => showStep('open'), 400);
}

// Allow Enter key on footer send button
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !footerSend.disabled && pendingReplies.length) sendDraft();
});

// ── Start ──────────────────────────────────────────────────────────────────
updateProgress();
setTimeout(() => showStep('open'), 600);

</script>
</body>
</html>
